name: Reusable Phoenix delivery

on:
  workflow_call:
    inputs:
      artifact-name:
        type: string
        default: phoenix-release
      otp-app:
        type: string
        required: true
      remote-env-prefix:
        type: string
        required: true
      deploy-staging:
        type: boolean
        default: true
      deploy-production:
        type: boolean
        default: false
      release-version-command:
        type: string
        default: "cat _build/VERSION"
      staging-environment-url:
        type: string
        required: true
      production-environment-url:
        type: string
        default: ""
    secrets:
      staging-host:
        required: true
      staging-ssh-host:
        required: false
      staging-ssh-user:
        required: true
      staging-ssh-private-key:
        required: true
      staging-ssh-known-hosts:
        required: true
      staging-remote-deploy-script:
        required: true
      production-host:
        required: false
      production-ssh-host:
        required: false
      production-ssh-user:
        required: false
      production-ssh-private-key:
        required: false
      production-ssh-known-hosts:
        required: false
      production-remote-deploy-script:
        required: false

permissions:
  contents: write

jobs:
  deploy_staging:
    if: ${{ inputs.deploy-staging && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ inputs.staging-environment-url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: ogourment/github-ci-cd-harness
          ref: v0.4.43
          path: .ci-cd-harness
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: _build
      - name: Restore production release with Unix permissions
        run: |
          mkdir -p _build/prod/rel
          tar -C _build/prod/rel -xzf _build/release.tar.gz
      - name: Deploy the verified release to staging
        env:
          CI_CD_OTP_APP: ${{ inputs.otp-app }}
          CI_CD_DEPLOY_HOST: ${{ secrets.staging-host }}
          CI_CD_DEPLOY_SSH_HOST: ${{ secrets.staging-ssh-host }}
          CI_CD_DEPLOY_SSH_USER: ${{ secrets.staging-ssh-user }}
          CI_CD_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.staging-ssh-private-key }}
          CI_CD_DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.staging-ssh-known-hosts }}
          CI_CD_REMOTE_DEPLOY_SCRIPT: ${{ secrets.staging-remote-deploy-script }}
          CI_CD_REMOTE_ENV_PREFIX: ${{ inputs.remote-env-prefix }}
          CI_CD_RELEASE_ARTIFACT_PATH: _build/prod/rel/${{ inputs.otp-app }}
          CI_CD_HEALTH_URL: ${{ inputs.staging-environment-url }}/health
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_COMMIT_REF_NAME: ${{ github.ref_name }}
          CI_PIPELINE_ID: ${{ github.run_id }}
          CI_PIPELINE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITLAB_USER_LOGIN: ${{ github.actor }}
        run: .ci-cd-harness/priv/core/deploy_release_fast.sh staging
      - name: Verify deployed release identity
        env:
          CI_CD_STAGING_SMOKE_URL: ${{ inputs.staging-environment-url }}/
        run: bash .ci-cd-harness/priv/core/staging_release_smoke.sh
      - name: Record staging verification for later promotion
        env:
          RELEASE_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        run: python3 .ci-cd-harness/priv/forges/github/staging_receipt.py > _build/staging-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}-staging-verification
          path: _build/staging-verification.json
          if-no-files-found: error
          retention-days: 14

  deploy_production:
    concurrency:
      group: ${{ github.repository }}-production
      cancel-in-progress: false
    if: ${{ inputs.deploy-production && github.ref == 'refs/heads/main' }}
    needs: deploy_staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ inputs.production-environment-url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: ogourment/github-ci-cd-harness
          ref: v0.4.43
          path: .ci-cd-harness
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: _build
      - name: Restore production release with Unix permissions
        run: |
          mkdir -p _build/prod/rel
          tar -C _build/prod/rel -xzf _build/release.tar.gz
      - name: Deploy the staging-verified release to production
        env:
          CI_CD_OTP_APP: ${{ inputs.otp-app }}
          CI_CD_DEPLOY_HOST: ${{ secrets.production-host }}
          CI_CD_DEPLOY_SSH_HOST: ${{ secrets.production-ssh-host }}
          CI_CD_DEPLOY_SSH_USER: ${{ secrets.production-ssh-user }}
          CI_CD_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.production-ssh-private-key }}
          CI_CD_DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.production-ssh-known-hosts }}
          CI_CD_REMOTE_DEPLOY_SCRIPT: ${{ secrets.production-remote-deploy-script }}
          CI_CD_REMOTE_ENV_PREFIX: ${{ inputs.remote-env-prefix }}
          CI_CD_RELEASE_ARTIFACT_PATH: _build/prod/rel/${{ inputs.otp-app }}
          CI_CD_HEALTH_URL: ${{ inputs.production-environment-url }}/health
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_COMMIT_REF_NAME: ${{ github.ref_name }}
          CI_PIPELINE_ID: ${{ github.run_id }}
          CI_PIPELINE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITLAB_USER_LOGIN: ${{ github.actor }}
        run: .ci-cd-harness/priv/core/deploy_release_fast.sh production

  release_tag:
    if: ${{ inputs.deploy-production && github.ref == 'refs/heads/main' }}
    needs: deploy_production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: ogourment/github-ci-cd-harness
          ref: v0.4.43
          path: .ci-cd-harness
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: _build
      - name: Tag the successfully deployed release
        env:
          CI_CD_RELEASE_VERSION_COMMAND: ${{ inputs.release-version-command }}
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_REPOSITORY_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          CI_CD_RELEASE_TAGGER_NAME: GitHub Actions release
          CI_CD_RELEASE_TAGGER_EMAIL: release@github-actions.invalid
        run: .ci-cd-harness/priv/core/release_tag.sh publish
