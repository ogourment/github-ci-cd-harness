---
# nginx + Certbot TLS for a Phoenix app. Run phoenix_blue_green before this role
# so the upstream include exists before nginx validates the virtual host.
web_packages:
  - nginx
  - certbot
  - python3-certbot-nginx

nginx_site_name: "{{ app_name }}"
server_aliases: []
nginx_legacy_site_names: []
nginx_legacy_upstream_includes: []
nginx_drop_scanner_probes: true

# Optional persistent static uploads served directly by nginx. Set both values
# together; the URL prefix starts with a slash and omits the trailing slash.
nginx_uploads_dir: ""
nginx_uploads_url_prefix: ""
