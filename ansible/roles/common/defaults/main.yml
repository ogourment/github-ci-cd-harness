---
# Base Ubuntu host provisioning shared by Phoenix applications. Application
# runtime, PostgreSQL, nginx/TLS, and backups are owned by their dedicated
# roles. Set SSH keys and all secrets in consumer inventory/group_vars.
common_packages:
  - git
  - curl
  - rsync
  - acl
  - ufw
  - fail2ban
  - jq
  - bat

tailscale_enabled: false
tailscale_auth_key: ""
tailscale_hostname: "{{ inventory_hostname }}"

system_toolbox_enabled: false
system_toolbox_dir: "/home/{{ deploy_user }}/work/python/system-toolbox"
system_toolbox_host: "0.0.0.0"
system_toolbox_port: 8789
system_toolbox_uv_path: "/home/{{ deploy_user }}/.local/bin/uv"
deploy_user_uid: 1000

glab_manage: false
glab_version: ""
glab_deb_url: ""

ssh_allowed_users:
  - "{{ deploy_user }}"
ssh_deploy_pubkey_files: []
ssh_login_grace_time: "30"
ssh_max_auth_tries: 3
ssh_max_startups: "20:30:60"
ssh_per_source_max_startups: 3

journald_system_max_use: "500M"
journald_system_max_file_size: "100M"
journald_max_retention_sec: "2week"

fail2ban_sshd_bantime: "1h"
fail2ban_sshd_findtime: "10m"
fail2ban_sshd_maxretry: 8
fail2ban_honeypot_enabled: false
fail2ban_honeypot_name: "phoenix-honeypot"
fail2ban_honeypot_failregex: "^.*Honeypot triggered for (?:contact|interest) form from IP <HOST>\\s*$"
fail2ban_honeypot_bantime: "1h"
fail2ban_honeypot_findtime: "10m"
fail2ban_honeypot_maxretry: 1

firewall_manage: true
firewall_default_incoming_policy: deny
firewall_default_outgoing_policy: allow
firewall_logging: "on"
firewall_public_tcp_ports:
  - 80
  - 443
firewall_ssh_port: 22
firewall_allow_ssh_from_anywhere: true
firewall_ssh_allowed_cidrs: []
firewall_remove_tcp_ports: []
