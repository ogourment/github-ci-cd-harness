include:
  - local: "/templates/cd.yml"

stages:
  - build
  - deploy
  - verify
  - production

default:
  image: debian:bookworm-slim

variables:
  CI_CD_ENABLE_STAGING_DEPLOY: "false"
  CI_CD_ENABLE_RELEASE_TAG: "true"
  CI_CD_RELEASE_VERSION_COMMAND: "cat VERSION"

template_smoke:
  stage: build
  script:
    - test -f templates/cd.yml
    - awk '/^\.ci_cd_deploy_notify:/ {inside=1; next} /^\.ci_cd_fetch_harness:/ {exit} inside && /set \+e/ {found=1} END {exit !found}' templates/cd.yml
    - sh -n scripts/staging_release_smoke.sh
