include:
  - local: "/templates/cd.yml"
  - local: "/templates/acceptance.yml"

stages:
  - build
  - deploy
  - verify
  - production

default:
  image: debian:bookworm-slim

variables:
  CI_CD_ENABLE_STAGING_DEPLOY: "false"
  CI_CD_ENABLE_RELEASE_TAG: "true"
  CI_CD_RELEASE_VERSION_COMMAND: "cat VERSION"

template_smoke:
  stage: build
  script:
    - test -f templates/cd.yml
    - test -f templates/acceptance.yml
    - awk '/^\.ci_cd_deploy_notify:/ {inside=1; next} /^\.ci_cd_fetch_harness:/ {exit} inside && /set \+e/ {non_blocking=1} inside && /exit 0/ {zero_exit=1} END {exit !(non_blocking && zero_exit)}' templates/cd.yml
    - >-
      awk '/^acceptance_pages:/ {inside=1; next} inside && /^  pages:/ {pages=1}
      inside && /^    publish: public/ {publish=1} inside && /^[^ ]/ {exit}
      END {exit !(pages && publish)}' templates/acceptance.yml
    - sh -n scripts/staging_release_smoke.sh
    - sh -n scripts/verify_health_identity.sh
    - bash -n scripts/resource_preflight.sh tests/resource_preflight_test.sh
    - tests/resource_preflight_test.sh
    - printf '%s\n' '{"version":"1.2.3","release_id":"v1.2.3-abcdef12-99","pipeline_id":"99"}' > /tmp/health.json
    - scripts/verify_health_identity.sh /tmp/health.json 1.2.3 v1.2.3-abcdef12-99 99
    - '! scripts/verify_health_identity.sh /tmp/health.json 1.2.3 v1.2.3-abcdef12-99 100 2>/tmp/identity-error'
    - grep -q 'expected.*pipeline_id=100' /tmp/identity-error
    - grep -q 'actual.*pipeline_id=99' /tmp/identity-error

# This minimal consumer proves that the notification is attached to the gate.
# If a deploy is retried, GitLab schedules this gate only after evidence exists.
acceptance_evidence:
  stage: verify
  image: alpine:3.20
  needs: []
  script:
    - mkdir -p tmp/atdd public
    - printf '%s\n' 'acceptance summary' > tmp/atdd/acceptance_summary.txt
    - printf '%s\n' 'ATDD_TEST_EXIT_CODE=0' 'ACCEPTANCE_SITE_EXIT_CODE=0' 'ATDD_GATE_EXIT_CODE=0' > tmp/atdd/status.env
    - touch public/index.html
  artifacts:
    paths: [tmp/atdd/, public/]
    reports:
      dotenv: tmp/atdd/status.env

acceptance_gate:
  stage: verify
  image: alpine:3.20
  needs:
    - job: acceptance_evidence
      artifacts: true
  variables:
    ACCEPTANCE_NOTIFY_COMMAND: 'cp "$$ACCEPTANCE_MESSAGE_PATH" notification.txt'
  script:
    - test -s tmp/atdd/acceptance_summary.txt
  artifacts:
    paths: [notification.txt]

notification_proof:
  stage: production
  image: alpine:3.20
  needs:
    - job: acceptance_gate
      artifacts: true
  script:
    - test "$(cat notification.txt)" = 'acceptance summary'
