include:
  - local: "/templates/cd.yml"
  - local: "/templates/acceptance.yml"

stages:
  - build
  - deploy
  - verify
  - production

default:
  image: debian:bookworm-slim

variables:
  CI_CD_ENABLE_STAGING_DEPLOY: "false"
  CI_CD_ENABLE_RELEASE_TAG: "true"
  CI_CD_RELEASE_VERSION_COMMAND: "cat VERSION"

template_smoke:
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
  script:
    - test -f templates/cd.yml
    - test -f templates/acceptance.yml
    - awk '/^\.ci_cd_deploy_notify:/ {inside=1; next} /^\.ci_cd_fetch_harness:/ {exit} inside && /set \+e/ {non_blocking=1} inside && /exit 0/ {zero_exit=1} END {exit !(non_blocking && zero_exit)}' templates/cd.yml
    - >-
      awk '/^publish_acceptance_report:/ {inside=1; next}
      inside && /CI_CD_ENABLE_ACCEPTANCE_REPORT_PAGES == "true"/ {opt_in=1}
      inside && /^    publish: public/ {publish=1} inside && /^[^ ]/ {exit}
      END {exit !(opt_in && publish)}' templates/acceptance.yml
    - grep -Fq 'acceptance_report_url="${CI_JOB_URL}/artifacts/file/${ACCEPTANCE_PUBLIC_DIR%/}/index.html"' templates/acceptance.yml
    - sh -n scripts/staging_release_smoke.sh
    - bash -n scripts/release_tag.sh tests/release_tag_test.sh
    - sh -n scripts/verify_health_identity.sh
    - sh -n scripts/ci_cd_alert_event.sh
    - bash -n scripts/resource_preflight.sh scripts/intensive_command_lock.sh scripts/atdd_remote_copy.sh scripts/atdd_generate_thumbnails.sh \
      ansible/roles/phoenix_blue_green/templates/phoenix_telegram_notify.sh.j2 tests/resource_preflight_test.sh tests/intensive_command_lock_test.sh tests/deployment_metadata_contract_test.sh tests/atdd_remote_copy_test.sh tests/atdd_generate_thumbnails_test.sh tests/telegram_sender_contract_test.sh tests/alert_delivery_hook_test.sh tests/ansible_uploads_contract_test.sh tests/ansible_blue_green_failover_contract_test.sh tests/ansible_blue_green_legacy_contract_test.sh tests/ansible_operational_hardening_contract_test.sh
    - tests/resource_preflight_test.sh
    - tests/release_tag_test.sh
    - tests/intensive_command_lock_test.sh
    - tests/deployment_metadata_contract_test.sh
    - tests/atdd_remote_copy_test.sh
    - tests/atdd_generate_thumbnails_test.sh
    - tests/telegram_sender_contract_test.sh
    - tests/alert_delivery_hook_test.sh
    - tests/ansible_uploads_contract_test.sh
    - tests/ansible_blue_green_failover_contract_test.sh
    - tests/ansible_blue_green_legacy_contract_test.sh
    - tests/ansible_operational_hardening_contract_test.sh
    - printf '%s\n' '{"version":"1.2.3","release_id":"v1.2.3-abcdef12-99","pipeline_id":"99"}' > /tmp/health.json
    - scripts/verify_health_identity.sh /tmp/health.json 1.2.3 v1.2.3-abcdef12-99 99
    - '! scripts/verify_health_identity.sh /tmp/health.json 1.2.3 v1.2.3-abcdef12-99 100 2>/tmp/identity-error'
    - grep -q 'expected.*pipeline_id=100' /tmp/identity-error
    - grep -q 'actual.*pipeline_id=99' /tmp/identity-error

# This minimal consumer proves that the notification is attached to the gate.
# If a deploy is retried, GitLab schedules this gate only after evidence exists.
acceptance_evidence:
  stage: verify
  image: alpine:3.20
  needs: []
  rules:
    - if: '$CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH'
  script:
    - mkdir -p tmp/atdd
    - printf '%s\n' 'acceptance summary' > tmp/atdd/acceptance_summary.txt
    - printf '%s\n' 'ATDD_TEST_EXIT_CODE=0' 'ACCEPTANCE_SITE_EXIT_CODE=0' 'ATDD_GATE_EXIT_CODE=0' > tmp/atdd/status.env
  artifacts:
    paths: [tmp/atdd/]
    reports:
      dotenv: tmp/atdd/status.env

acceptance_gate:
  stage: verify
  image: alpine:3.20
  rules:
    - if: '$CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH'
  needs:
    - job: acceptance_evidence
      artifacts: true
  variables:
    ACCEPTANCE_NOTIFY_COMMAND: 'cp "$$ACCEPTANCE_MESSAGE_PATH" notification.txt'
  script:
    - test -s tmp/atdd/acceptance_summary.txt
  artifacts:
    paths: [notification.txt]

notification_proof:
  stage: production
  image: alpine:3.20
  rules:
    - if: '$CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH'
  needs:
    - job: acceptance_gate
      artifacts: true
  script:
    - test "$(cat notification.txt)" = 'acceptance summary'

# This repository releases exactly when its canonical VERSION changes. Keep the
# shared template manual for consumers that use a different release process.
release_tag:
  before_script: []
  script:
    - scripts/release_tag.sh publish
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_CD_ENABLE_RELEASE_TAG == "true"'
      changes:
        - VERSION
      when: on_success
    - when: never
