variables:
  CI_CD_HARNESS_URL: "https://git.agile-u.com/olivierg/ci-cd-harness.git"
  CI_CD_HARNESS_REF: "v0.4.27"
  # Publishing a report to GitLab Pages creates a Pages deployment. Keep that
  # separate from acceptance verification, so consumers opt in deliberately.
  CI_CD_ENABLE_ACCEPTANCE_REPORT_PAGES: "false"

acceptance_fast:
  # Consumers that declare a dedicated acceptance stage should override this.
  # Build is the backwards-compatible default for existing stage lists.
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_CD_ENABLE_STAGING_DEPLOY == "true"'
      when: on_success
    - when: never
  variables:
    ACCEPTANCE_PHASE: "fast"
    ACCEPTANCE_SELECTION_PLAN: "tmp/acceptance-selection.json"
    ACCEPTANCE_FAST_EVIDENCE_DIR: "tmp/atdd-fast"
    ACCEPTANCE_FAST_SUMMARY_PATH: "tmp/atdd-fast/release_summary.txt"
  script:
    - |
      if [ ! -x .ci-cd-harness/priv/core/pipeline_acceptance_report.sh ]; then
        : "${CI_CD_HARNESS_URL:?CI_CD_HARNESS_URL is required}"
        : "${CI_CD_HARNESS_REF:?CI_CD_HARNESS_REF is required for fast acceptance}"
        rm -rf .ci-cd-harness
        git clone --quiet --depth 1 --branch "$CI_CD_HARNESS_REF" \
          "${CI_CD_HARNESS_URL}" \
          .ci-cd-harness
      fi
    - ': "${ACCEPTANCE_FAST_COMMAND:?ACCEPTANCE_FAST_COMMAND is required}"'
    - bash -lc "$ACCEPTANCE_FAST_COMMAND"
  after_script:
    - |
      set +e
      mkdir -p "${ACCEPTANCE_FAST_EVIDENCE_DIR:-tmp/atdd-fast}"
      .ci-cd-harness/priv/core/pipeline_acceptance_report.sh staging \
        > "${ACCEPTANCE_FAST_SUMMARY_PATH:-tmp/atdd-fast/release_summary.txt}"
  artifacts:
    when: always
    paths:
      - tmp/acceptance-selection.json
      - tmp/atdd-fast/
    expire_in: 1 month

acceptance_evidence:
  stage: verify
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_CD_ENABLE_STAGING_DEPLOY == "true"'
      when: on_success
    - when: never
  # Serializes run snapshot creation and current-link advancement across
  # pipelines. The copy helper also rejects backward current-link movement.
  resource_group: "$CI_PROJECT_PATH_SLUG-acceptance-evidence"
  needs:
    - job: deploy_staging
      artifacts: false
    - job: acceptance_fast
      artifacts: true
  variables:
    ATDD_ENVIRONMENT: "$ACCEPTANCE_ENVIRONMENT"
    ATDD_TARGET: "$ACCEPTANCE_TARGET"
    ATDD_BASE_URL: "$ACCEPTANCE_BASE_URL"
    ATDD_APP_NAME: "$ACCEPTANCE_APP_NAME"
    ATDD_APP_OTP_NAME: "$ACCEPTANCE_APP_OTP_NAME"
  script:
    - |
      if [ ! -x .ci-cd-harness/priv/core/acceptance_evidence.sh ]; then
        : "${CI_CD_HARNESS_URL:?CI_CD_HARNESS_URL is required}"
        : "${CI_CD_HARNESS_REF:?CI_CD_HARNESS_REF is required for acceptance evidence}"
        rm -rf .ci-cd-harness
        git clone --quiet --depth 1 --branch "$CI_CD_HARNESS_REF" \
          "${CI_CD_HARNESS_URL}" \
          .ci-cd-harness
      fi
    - .ci-cd-harness/priv/core/acceptance_evidence.sh
  artifacts:
    when: always
    paths:
      - tmp/atdd/
      - public/
    reports:
      dotenv: "$ACCEPTANCE_EVIDENCE_DIR/status.env"
    expire_in: 1 month

acceptance_gate:
  stage: verify
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_CD_ENABLE_STAGING_DEPLOY == "true"'
      when: on_success
    - when: never
  needs:
    - job: acceptance_evidence
      artifacts: true
  script:
    - |
      set -euo pipefail
      : "${ACCEPTANCE_EVIDENCE_DIR:=tmp/atdd}"
      : "${ACCEPTANCE_MIX_ENV:=test}"
      MIX_ENV="$ACCEPTANCE_MIX_ENV" mix acceptance.gate "$ACCEPTANCE_EVIDENCE_DIR/status.env" "$ACCEPTANCE_EVIDENCE_DIR/e2e.md"
  # The notifier belongs to the gate, rather than a standalone `when: always`
  # job. A failed deploy can skip evidence; if that deploy is retried, GitLab
  # schedules this gate once evidence exists, so a notification is never
  # consumed prematurely by an empty artifact.
  after_script:
    - |
      # Notification transport must not change the gate result, even in
      # projects that set AFTER_SCRIPT_IGNORE_ERRORS=false.
      set +e
      if [ "${CI_JOB_STATUS:-}" = "canceled" ]; then
        exit 0
      fi

      : "${ACCEPTANCE_EVIDENCE_DIR:=tmp/atdd}"
      : "${ACCEPTANCE_TELEGRAM_MESSAGE_PATH:=acceptance_summary.txt}"
      acceptance_message_path="${ACCEPTANCE_EVIDENCE_DIR%/}/${ACCEPTANCE_TELEGRAM_MESSAGE_PATH}"
      : "${ACCEPTANCE_NOTIFY_COMMAND:=}"
      : "${CI_CD_ALERT_ADAPTER:=}"

      if [ ! -s "$acceptance_message_path" ]; then
        echo "acceptance notify skipped: missing summary at $acceptance_message_path"
        exit 0
      fi

      acceptance_notify_silent=false
      if [ "${ATDD_TEST_EXIT_CODE:-1}" = "0" ] && [ "${ACCEPTANCE_SITE_EXIT_CODE:-1}" = "0" ] && [ "${ATDD_GATE_EXIT_CODE:-1}" = "0" ]; then
        acceptance_notify_silent=true
      fi

      if [ -n "$CI_CD_ALERT_ADAPTER" ]; then
        alert_helper="${CI_CD_ALERT_HELPER:-.ci-cd-harness/priv/core/ci_cd_alert_event.sh}"

        if [ ! -x "$alert_helper" ]; then
          : "${CI_CD_HARNESS_URL:?CI_CD_HARNESS_URL is required}"
          : "${CI_CD_HARNESS_REF:?CI_CD_HARNESS_REF is required when CI_CD_ALERT_ADAPTER is set}"
          rm -rf .ci-cd-harness
          git clone --depth 1 --branch "$CI_CD_HARNESS_REF" \
            "${CI_CD_HARNESS_URL}" \
            .ci-cd-harness
        fi

        alert_summary_path="/tmp/ci-cd-alert-summary-${CI_JOB_ID:-unknown}.txt"
        alert_event_path="/tmp/ci-cd-alert-event-${CI_JOB_ID:-unknown}.json"
        if [ "$acceptance_notify_silent" = "true" ]; then
          acceptance_result=passed
          acceptance_alert_status=success
          acceptance_alert_severity=info
        else
          acceptance_result=failed
          acceptance_alert_status=failed
          acceptance_alert_severity=critical
        fi

        printf '%s\n' \
          "${ACCEPTANCE_APP_NAME:-${CI_PROJECT_NAME:-Application}} acceptance ${acceptance_result}" \
          >"$alert_summary_path"

        export CI_CD_ALERT_STATUS="$acceptance_alert_status"
        export CI_CD_ALERT_SEVERITY="$acceptance_alert_severity"
        export CI_CD_ALERT_SUMMARY_PATH="$alert_summary_path"
        export CI_CD_ALERT_DETAILS_PATH="$acceptance_message_path"
        export CI_CD_ALERT_EVIDENCE_PATH="${ACCEPTANCE_EVIDENCE_DIR%/}/evidence.json"
        export CI_CD_ALERT_EVIDENCE_URL="${ACCEPTANCE_REPORT_URL:-${CI_JOB_URL:-}}"
        export CI_CD_ALERT_APPLICATION="${ACCEPTANCE_APP_NAME:-${CI_PROJECT_NAME:-unknown}}"
        export CI_CD_ALERT_ENVIRONMENT="${ACCEPTANCE_ENVIRONMENT:-${ACCEPTANCE_TARGET:-unknown}}"
        export CI_CD_ALERT_HOST="${ACCEPTANCE_HOST:-unknown}"
        export CI_CD_ALERT_RELEASE_ID="${ACCEPTANCE_RELEASE_ID:-unknown}"
        export CI_CD_ALERT_RELEASE_VERSION="${ACCEPTANCE_APP_VERSION:-unknown}"

        if [ -x "$alert_helper" ]; then
          "$alert_helper" acceptance "$alert_event_path"
        else
          echo "acceptance alert failed: helper is not executable at $alert_helper"
        fi
      elif [ -n "$ACCEPTANCE_NOTIFY_COMMAND" ]; then
        echo "ACCEPTANCE_NOTIFY_COMMAND is deprecated; use CI_CD_ALERT_ADAPTER"
        export ACCEPTANCE_MESSAGE_PATH="$acceptance_message_path"
        export ACCEPTANCE_MESSAGE="$(cat "$acceptance_message_path")"
        export ACCEPTANCE_NOTIFY_SILENT="$acceptance_notify_silent"
        sh -c "$ACCEPTANCE_NOTIFY_COMMAND" "$acceptance_message_path"
      elif [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
        if ! command -v curl >/dev/null 2>&1; then
          apk add --no-cache curl
        fi

        curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
          --data-urlencode "text@${acceptance_message_path}" \
          --data-urlencode "parse_mode=HTML" \
          --data-urlencode "disable_notification=${acceptance_notify_silent}" \
          --data-urlencode 'link_preview_options={"is_disabled":true}'
      else
        cat "$acceptance_message_path"
      fi

      acceptance_notify_exit_code="$?"
      if [ "$acceptance_notify_exit_code" -ne 0 ]; then
        echo "acceptance notify failed with exit code $acceptance_notify_exit_code; preserving the acceptance gate result"
      fi
      exit 0

publish_acceptance_report:
  stage: verify
  image: alpine:3.20
  pages:
    publish: public
  needs:
    - job: acceptance_evidence
      artifacts: true
  rules:
    - if: '$CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH && $CI_CD_ENABLE_ACCEPTANCE_REPORT_PAGES == "true"'
  script:
    - ': "${ACCEPTANCE_PUBLIC_DIR:=public}"'
    - test -f "$ACCEPTANCE_PUBLIC_DIR/index.html"
    - find "$ACCEPTANCE_PUBLIC_DIR" -maxdepth 3 -type f | sort
