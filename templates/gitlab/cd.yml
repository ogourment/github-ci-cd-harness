variables:
  CI_CD_HARNESS_URL: "https://git.agile-u.com/olivierg/ci-cd-harness.git"
  CI_CD_HARNESS_REF: "v0.4.36"
  CI_CD_ENABLE_STAGING_DEPLOY: "true"
  CI_CD_ENABLE_PROD_DEPLOY: "false"
  CI_CD_ENABLE_RELEASE_TAG: "false"
  CI_CD_RELEASE_TAG_PREFIX: "v"
  CI_CD_RELEASE_VERSION_COMMAND: 'sed -nE ''s/^[[:space:]]*version:[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p'' mix.exs | head -n 1'
  CI_CD_RUN_MIGRATIONS: "migrate"
  CI_CD_RELEASE_ARTIFACT_KIND: "directory"
  CI_CD_REMOTE_RELEASES_ROOT: "/home/deploy/releases"
  CI_CD_ENABLE_STAGING_SMOKE: "true"
  CI_CD_STAGING_SMOKE_URL: "$STAGING_ENVIRONMENT_URL"
  CI_CD_STAGING_SMOKE_TIMEOUT_SECONDS: "30"

stages:
  - test
  - build
  - deploy
  - verify
  - production

.ci_cd_fetch_harness: &ci_cd_fetch_harness
  - |
    set -euo pipefail
    : "${CI_CD_HARNESS_URL:?CI_CD_HARNESS_URL is required}"
    : "${CI_CD_HARNESS_REF:?CI_CD_HARNESS_REF is required}"
    rm -rf .ci-cd-harness
    git clone --depth 1 --branch "$CI_CD_HARNESS_REF" "$CI_CD_HARNESS_URL" .ci-cd-harness

release_version_preflight:
  stage: .pre
  image: debian:bookworm-slim
  before_script:
    - apt-get update -y
    - apt-get install -y --no-install-recommends ca-certificates git
    - *ci_cd_fetch_harness
  script:
    - .ci-cd-harness/priv/core/release_tag.sh preflight
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_CD_ENABLE_RELEASE_TAG == "true" && $CI_CD_ENABLE_PROD_DEPLOY == "true"'
      when: on_success
    - when: never

build_release:
  stage: build
  variables:
    MIX_ENV: "prod"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_CD_ENABLE_STAGING_DEPLOY == "true"'
      when: on_success
    - when: never
  before_script:
    - apt-get update -y
    - apt-get install -y --no-install-recommends build-essential git curl rsync
    - command -v node >/dev/null 2>&1 || apt-get install -y --no-install-recommends nodejs npm
    - mix local.hex --force
    - mix local.rebar --force
  script:
    - |
      set -euo pipefail
      : "${CI_CD_OTP_APP:?CI_CD_OTP_APP is required}"
      : "${CI_CD_BUILD_COMMAND:=mix deps.get --only prod && npm ci --prefix assets && MIX_ENV=prod mix compile && MIX_ENV=prod mix assets.deploy && MIX_ENV=prod mix release}"
      : "${CI_CD_RELEASE_ARTIFACT_PATH:=_build/prod/rel/${CI_CD_OTP_APP}}"
      rm -rf _build/prod
      bash -lc "$CI_CD_BUILD_COMMAND"
      version="$(find "_build/prod/rel/${CI_CD_OTP_APP}/releases" -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
      release_id="${CI_CD_RELEASE_PREFIX:-v}${version}-${CI_COMMIT_SHORT_SHA}-${CI_PIPELINE_ID}"
      mkdir -p _build
      printf '%s\n' "$version" > _build/VERSION
      printf '%s\n' "$release_id" > _build/RELEASE_ID
      printf '%s\n' "$version" > "${CI_CD_RELEASE_ARTIFACT_PATH}/VERSION"
      printf '%s\n' "$release_id" > "${CI_CD_RELEASE_ARTIFACT_PATH}/RELEASE_ID"
  artifacts:
    paths:
      - _build/RELEASE_ID
      - _build/VERSION
      - _build/prod/rel/
    expire_in: 2 weeks

.ci_cd_deploy_template:
  stage: deploy
  needs:
    - job: build_release
      artifacts: true
  before_script:
    - apt-get update -y
    - apt-get install -y --no-install-recommends curl git openssh-client python3 rsync
    - *ci_cd_fetch_harness
  script:
    - .ci-cd-harness/priv/core/deploy_release_fast.sh "$CI_CD_DEPLOY_TARGET"
  after_script:
    - .ci-cd-harness/priv/core/notify_deployment.sh

deploy_staging:
  extends: .ci_cd_deploy_template
  variables:
    CI_CD_DEPLOY_TARGET: "staging"
    CI_CD_DEPLOY_HOST: "$STAGING_HOST"
    CI_CD_DEPLOY_SSH_HOST: "$STAGING_SSH_HOST"
    CI_CD_DEPLOY_SSH_USER: "$STAGING_SSH_USER"
    CI_CD_DEPLOY_SSH_PRIVATE_KEY: "$STAGING_SSH_PRIVATE_KEY"
    CI_CD_REMOTE_DEPLOY_SCRIPT: "$STAGING_REMOTE_DEPLOY_SCRIPT"
    CI_CD_HEALTH_URL: "$STAGING_HEALTH_URL"
    CI_CD_WEBSOCKET_BASE_URL: "$STAGING_WEBSOCKET_BASE_URL"
  environment:
    name: staging
    url: "$STAGING_ENVIRONMENT_URL"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_CD_ENABLE_STAGING_DEPLOY == "true"'
      when: on_success
    - when: never

staging_release_smoke:
  stage: verify
  image: alpine:3.21
  needs:
    - job: deploy_staging
      artifacts: false
  before_script:
    - apk add --no-cache curl git
    - *ci_cd_fetch_harness
  script:
    - .ci-cd-harness/priv/core/staging_release_smoke.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_CD_ENABLE_STAGING_DEPLOY == "true" && $CI_CD_ENABLE_STAGING_SMOKE != "false"'
      when: on_success
    - when: never

deploy_prod:
  extends: .ci_cd_deploy_template
  stage: production
  needs:
    - job: release_version_preflight
      artifacts: false
      optional: true
    - job: build_release
      artifacts: true
    - job: deploy_staging
      artifacts: false
    - job: acceptance_gate
      artifacts: false
      optional: true
    - job: staging_release_smoke
      artifacts: false
      optional: true
  variables:
    CI_CD_DEPLOY_TARGET: "prod"
    CI_CD_DEPLOY_HOST: "$PROD_HOST"
    CI_CD_DEPLOY_SSH_HOST: "$PROD_SSH_HOST"
    CI_CD_DEPLOY_SSH_USER: "$PROD_SSH_USER"
    CI_CD_DEPLOY_SSH_PRIVATE_KEY: "$PROD_SSH_PRIVATE_KEY"
    CI_CD_REMOTE_DEPLOY_SCRIPT: "$PROD_REMOTE_DEPLOY_SCRIPT"
    CI_CD_HEALTH_URL: "$PROD_HEALTH_URL"
    CI_CD_WEBSOCKET_BASE_URL: "$PROD_WEBSOCKET_BASE_URL"
  environment:
    name: production
    url: "$PROD_ENVIRONMENT_URL"
  script:
    - |
      if [[ "$CI_CD_ENABLE_RELEASE_TAG" == "true" ]]; then
        .ci-cd-harness/priv/core/release_tag.sh preflight
      fi
    - .ci-cd-harness/priv/core/deploy_release_fast.sh "$CI_CD_DEPLOY_TARGET"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_CD_ENABLE_PROD_DEPLOY == "true"'
      when: manual
    - when: never

release_tag:
  stage: production
  needs:
    - job: deploy_prod
      artifacts: false
      optional: true
  before_script:
    - apt-get update -y
    - apt-get install -y --no-install-recommends ca-certificates git
    - *ci_cd_fetch_harness
  script:
    - .ci-cd-harness/priv/core/release_tag.sh publish
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_CD_ENABLE_RELEASE_TAG == "true" && $CI_CD_ENABLE_PROD_DEPLOY == "true"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_CD_ENABLE_RELEASE_TAG == "true"'
      when: manual
    - when: never
