variables:
  CI_CD_HARNESS_PROJECT: "olivierg/gitlab-ci-cd-harness"
  CI_CD_HARNESS_REF: "v0.2.20"
  CI_CD_ENABLE_STAGING_DEPLOY: "true"
  CI_CD_ENABLE_PROD_DEPLOY: "false"
  CI_CD_ENABLE_ANSIBLE_DEPLOY_JOBS: "false"
  CI_CD_RUN_MIGRATIONS: "migrate"
  CI_CD_RELEASE_ARTIFACT_KIND: "directory"
  CI_CD_REMOTE_RELEASES_ROOT: "/home/deploy/releases"
  CI_CD_DEPLOY_TIMEOUT_SECONDS: "120"

.ci_cd_deploy_notify: &ci_cd_deploy_notify
  - |
    set -euo pipefail

    : "${CI_CD_APP_NAME:=${CI_PROJECT_NAME:-project}}"
    : "${CI_CD_DEPLOY_TARGET:=unknown}"

    if [ "${CI_JOB_STATUS:-success}" = "success" ]; then
      deploy_icon="✅"
      deploy_status="passed"
      deploy_silent=true
    else
      deploy_icon="❌"
      deploy_status="failed"
      deploy_silent=false
    fi

    release_id="$(cat _build/RELEASE_ID 2>/dev/null || echo unknown)"
    app_version="$(cat _build/VERSION 2>/dev/null || echo unknown)"
    actor="${GITLAB_USER_LOGIN:-${GITLAB_USER_NAME:-unknown}}"
    pipeline_id="${CI_PIPELINE_ID:-unknown}"
    job_id="${CI_JOB_ID:-unknown}"

    if [ -n "${CI_COMMIT_BEFORE_SHA:-}" ] && [ "${CI_COMMIT_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
      ci_deploy_commit_messages="$(git log --no-merges --pretty=format:'%h %s' --max-count=25 --since='7 days ago' "${CI_COMMIT_BEFORE_SHA}..${CI_COMMIT_SHA}" 2>/dev/null || true)"
    else
      ci_deploy_commit_messages="$(git log --no-merges --pretty=format:'%h %s' --max-count=25 --since='7 days ago' 2>/dev/null || true)"
    fi

    if [ -z "${ci_deploy_commit_messages:-}" ]; then
      ci_deploy_commit_messages="$(git log --no-merges --pretty=format:'%h %s' --max-count=5 -- "${CI_COMMIT_SHA:-HEAD}" 2>/dev/null || true)"
    fi

    commit_count="$(printf '%s\n' "${ci_deploy_commit_messages}" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')"
    if [ "$commit_count" = "" ]; then
      commit_count=0
    fi

    seconds_from_timestamp() {
      date -u -d "$1" +%s 2>/dev/null || true
    }

    job_metadata_field() {
      local field="$1"

      if [ -z "${CI_API_V4_URL:-}" ] || [ -z "${CI_PROJECT_ID:-}" ] || [ -z "${CI_JOB_ID:-}" ] || [ -z "${CI_JOB_TOKEN:-}" ]; then
        return 0
      fi

      curl -fsS --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/${CI_JOB_ID}" 2>/dev/null |
        python3 -c '
import json
import sys

field = sys.argv[1]
try:
    payload = json.load(sys.stdin)
except Exception:
    raise SystemExit(0)

value = payload.get(field)
if value:
    print(value)
' "$field" || true
    }

    duration_label() {
      local seconds="$1"

      case "$seconds" in
        ''|*[!0-9]*)
          echo "unknown"
          return
          ;;
      esac

      printf '%sm %ss' "$((seconds / 60))" "$((seconds % 60))"
    }

    deploy_seconds="unknown"
    wait_seconds="unknown"
    total_seconds="unknown"

    job_created_at="${CI_JOB_CREATED_AT:-}"
    job_started_at="${CI_JOB_STARTED_AT:-}"

    if [ -z "$job_created_at" ]; then
      job_created_at="$(job_metadata_field created_at)"
    fi
    if [ -z "$job_started_at" ]; then
      job_started_at="$(job_metadata_field started_at)"
    fi

    if [ -n "$job_started_at" ]; then
      job_start_epoch="$(seconds_from_timestamp "$job_started_at")"
    fi
    if [ -n "${job_start_epoch:-}" ]; then
      deploy_seconds="$(($(date -u +%s) - job_start_epoch))"
    fi

    if [ -n "$job_created_at" ] && [ -n "$job_started_at" ]; then
      job_created_epoch="$(seconds_from_timestamp "$job_created_at")"
      if [ -n "${job_created_epoch:-}" ] && [ -n "${job_start_epoch:-}" ]; then
        wait_seconds="$((job_start_epoch - job_created_epoch))"
      fi
    fi

    if [ -n "${CI_PIPELINE_CREATED_AT:-}" ]; then
      pipeline_created_epoch="$(seconds_from_timestamp "${CI_PIPELINE_CREATED_AT}")"
      if [ -n "${pipeline_created_epoch:-}" ]; then
        total_seconds="$(($(date -u +%s) - pipeline_created_epoch))"
      fi
    fi

    html_escape() {
      printf '%s' "$1" | sed -e 's/&/\\&amp;/g' -e 's/</\\&lt;/g' -e 's/>/\\&gt;/g'
    }

    message="${deploy_icon} <b>[${CI_CD_DEPLOY_TARGET}] ${CI_CD_APP_NAME} <code>v${app_version}</code> ${deploy_status}</b>"
    message+=$'\n'"Pipeline: <code>${pipeline_id}</code> job <code>${job_id}</code>"
    message+=$'\n'"Release: <code>${release_id}</code>"
    message+=$'\n'"Actor: <code>${actor}</code>"
    message+=$'\n'"Timing: deploy=<code>$(duration_label "${deploy_seconds}")</code> wait=<code>$(duration_label "${wait_seconds}")</code> total=<code>$(duration_label "${total_seconds}")</code>"

    if [ "${commit_count}" -gt 0 ]; then
      message+=$'\n'"Commits: ${commit_count}"
      printed=0
      while IFS= read -r commit_line; do
        [ -z "${commit_line}" ] && continue
        if [ "$printed" -ge 5 ]; then
          continue
        fi
        commit_hash="${commit_line%% *}"
        commit_subject="${commit_line#* }"
        if [ "$commit_hash" != "$commit_line" ] && [[ "$commit_hash" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
          message+=$'\n'"- <code>$(html_escape "${commit_hash}")</code> $(html_escape "${commit_subject}")"
        else
          message+=$'\n'"- $(html_escape "${commit_line}")"
        fi
        printed=$((printed + 1))
      done <<< "${ci_deploy_commit_messages}"
      if [ "${commit_count}" -gt 5 ]; then
        message+=$'\n'"... $((commit_count - 5)) more"
      fi
    fi

    if [ "${TELEGRAM_BOT_TOKEN:-}" != "" ] && [ "${TELEGRAM_CHAT_ID:-}" != "" ]; then
      curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
        --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
        --data-urlencode "text=${message}" \
        --data-urlencode "parse_mode=HTML" \
        --data-urlencode "disable_notification=${deploy_silent}" >/dev/null || true
    else
      printf '%b\n' "${message}"
    fi


.ci_cd_fetch_harness: &ci_cd_fetch_harness
  - |
    set -euo pipefail
    : "${CI_CD_HARNESS_PROJECT:=olivierg/gitlab-ci-cd-harness}"
    : "${CI_CD_HARNESS_REF:=main}"
    rm -rf .gitlab-ci-cd-harness
    git clone --depth 1 --branch "$CI_CD_HARNESS_REF" \
      "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_CD_HARNESS_PROJECT}.git" \
      .gitlab-ci-cd-harness

build_release:
  stage: build
  variables:
    MIX_ENV: "prod"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_CD_ENABLE_STAGING_DEPLOY == "true"'
      when: on_success
    - when: never
  before_script:
    - apt-get update -y
    - apt-get install -y --no-install-recommends build-essential git curl rsync nodejs npm
    - mix local.hex --force
    - mix local.rebar --force
  script:
    - |
      set -euo pipefail
      : "${CI_CD_OTP_APP:?CI_CD_OTP_APP is required}"
      : "${CI_CD_BUILD_COMMAND:=mix deps.get --only prod && npm ci --prefix assets && MIX_ENV=prod mix compile && MIX_ENV=prod mix assets.deploy && MIX_ENV=prod mix release}"
      : "${CI_CD_RELEASE_ARTIFACT_KIND:=directory}"
      : "${CI_CD_RELEASE_ARTIFACT_PATH:=_build/prod/rel/${CI_CD_OTP_APP}}"

      rm -rf _build/prod
      bash -lc "$CI_CD_BUILD_COMMAND"

      version="$(find "_build/prod/rel/${CI_CD_OTP_APP}/releases" -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
      release_id="${CI_CD_RELEASE_PREFIX:-v}${version}-${CI_COMMIT_SHORT_SHA}-${CI_PIPELINE_ID}"
      mkdir -p _build tmp
      printf '%s\n' "$version" > _build/VERSION
      printf '%s\n' "$release_id" > _build/RELEASE_ID

      case "$CI_CD_RELEASE_ARTIFACT_KIND" in
        directory)
          printf '%s\n' "$version" > "${CI_CD_RELEASE_ARTIFACT_PATH}/VERSION"
          printf '%s\n' "$release_id" > "${CI_CD_RELEASE_ARTIFACT_PATH}/RELEASE_ID"
          ;;
        archive)
          archive="tmp/${CI_CD_OTP_APP}-${release_id}.tar.gz"
          tar -C "$(dirname "$CI_CD_RELEASE_ARTIFACT_PATH")" -czf "$archive" "$(basename "$CI_CD_RELEASE_ARTIFACT_PATH")"
          printf '%s\n' "$archive" > _build/RELEASE_ARCHIVE
          ;;
        *)
          echo "Unsupported CI_CD_RELEASE_ARTIFACT_KIND: $CI_CD_RELEASE_ARTIFACT_KIND" >&2
          exit 2
          ;;
      esac
  artifacts:
    paths:
      - _build/RELEASE_ID
      - _build/VERSION
      - _build/RELEASE_ARCHIVE
      - _build/prod/rel/
      - tmp/*.tar.gz
    expire_in: 1 week

.ci_cd_deploy_template:
  stage: deploy
  needs:
    - job: build_release
      artifacts: true
  dependencies:
    - build_release
  before_script:
    - apt-get update -y
    - apt-get install -y --no-install-recommends curl git openssh-client python3 rsync
    - *ci_cd_fetch_harness
  script:
    - .gitlab-ci-cd-harness/scripts/deploy_release_fast.sh "$CI_CD_DEPLOY_TARGET"
  after_script: *ci_cd_deploy_notify

deploy_staging:
  extends: .ci_cd_deploy_template
  variables:
    CI_CD_DEPLOY_TARGET: "staging"
    CI_CD_DEPLOY_HOST: "$STAGING_HOST"
    CI_CD_DEPLOY_SSH_HOST: "$STAGING_SSH_HOST"
    CI_CD_DEPLOY_SSH_USER: "$STAGING_SSH_USER"
    CI_CD_DEPLOY_SSH_PRIVATE_KEY: "$STAGING_SSH_PRIVATE_KEY"
    CI_CD_REMOTE_DEPLOY_SCRIPT: "$STAGING_REMOTE_DEPLOY_SCRIPT"
    CI_CD_HEALTH_URL: "$STAGING_HEALTH_URL"
    CI_CD_WEBSOCKET_BASE_URL: "$STAGING_WEBSOCKET_BASE_URL"
  environment:
    name: staging
    url: "$STAGING_ENVIRONMENT_URL"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_CD_ENABLE_STAGING_DEPLOY == "true"'
      when: on_success
    - when: never

deploy_prod:
  extends: .ci_cd_deploy_template
  stage: production
  needs:
    - job: build_release
      artifacts: true
    - job: deploy_staging
      artifacts: false
    - job: acceptance_gate
      artifacts: false
      optional: true
  variables:
    CI_CD_DEPLOY_TARGET: "prod"
    CI_CD_DEPLOY_HOST: "$PROD_HOST"
    CI_CD_DEPLOY_SSH_HOST: "$PROD_SSH_HOST"
    CI_CD_DEPLOY_SSH_USER: "$PROD_SSH_USER"
    CI_CD_DEPLOY_SSH_PRIVATE_KEY: "$PROD_SSH_PRIVATE_KEY"
    CI_CD_REMOTE_DEPLOY_SCRIPT: "$PROD_REMOTE_DEPLOY_SCRIPT"
    CI_CD_HEALTH_URL: "$PROD_HEALTH_URL"
    CI_CD_WEBSOCKET_BASE_URL: "$PROD_WEBSOCKET_BASE_URL"
  environment:
    name: production
    url: "$PROD_ENVIRONMENT_URL"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_CD_ENABLE_PROD_DEPLOY == "true"'
      when: manual
      allow_failure: true
    - when: never

.ci_cd_ansible_deploy_template:
  stage: deploy
  needs:
    - job: build_release
      artifacts: true
  dependencies:
    - build_release
  before_script:
    - apt-get update -y
    - apt-get install -y --no-install-recommends ansible curl git openssh-client rsync
    - *ci_cd_fetch_harness
  script:
    - .gitlab-ci-cd-harness/scripts/deploy_release_ansible.sh "$CI_CD_DEPLOY_TARGET"
  after_script: *ci_cd_deploy_notify

deploy_staging_ansible:
  extends: .ci_cd_ansible_deploy_template
  variables:
    CI_CD_DEPLOY_TARGET: "staging"
    CI_CD_ANSIBLE_INVENTORY: "$STAGING_ANSIBLE_INVENTORY"
    CI_CD_DEPLOY_SSH_PRIVATE_KEY: "$STAGING_SSH_PRIVATE_KEY"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_CD_ENABLE_ANSIBLE_DEPLOY_JOBS == "true"'
      when: manual
      allow_failure: true
    - when: never

deploy_prod_ansible:
  extends: .ci_cd_ansible_deploy_template
  stage: production
  variables:
    CI_CD_DEPLOY_TARGET: "prod"
    CI_CD_ANSIBLE_INVENTORY: "$PROD_ANSIBLE_INVENTORY"
    CI_CD_DEPLOY_SSH_PRIVATE_KEY: "$PROD_SSH_PRIVATE_KEY"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_CD_ENABLE_ANSIBLE_DEPLOY_JOBS == "true"'
      when: manual
      allow_failure: true
    - when: never
