---
# Generic DB (+ optional uploads) backup for a Phoenix app host: a pg_dump
# snapshot on a systemd timer, with tiered retention. Consumer vars (shared
# naming): deploy_user, app_name, app_root, app_env_file, backup_root,
# backup_script_path, backup_service_unit, backup_timer_unit, backup_pg_dump_bin,
# backup_keep_recent, backup_keep_daily_days, backup_keep_weekly_days,
# backup_timer_on_calendar, backup_timer_randomized_delay_sec, backup_manage.
# Blue/green consumers may provide app_current_color_file; the backup script
# then resolves app_env_file_<active color> when the unsuffixed file is absent.
# backup_app_env_file and backup_current_color_file override those shared vars.
# Persistent uploads automatically follow phoenix_uploads_env_var when the
# runtime role defines it. backup_uploads_env_var can override that shared
# variable. backup_uploads_required defaults true whenever either is set.
# backup_exclude_table_data lists tables whose contents are left out of the dump
# (schema is still dumped, so a restore recreates them empty). Use it for large
# regenerable data whose recovery value does not justify its backup size; the
# snapshot records the list in BACKUP_EXCLUDED_TABLE_DATA.
- name: Ensure backup directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0700"
  loop:
    - "{{ backup_root }}"
    - "{{ backup_root }}/snapshots"
  when: backup_manage

- name: Install backup script
  ansible.builtin.template:
    src: backup.sh.j2
    dest: "{{ backup_script_path }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart backup timer
  when: backup_manage

- name: Install backup restore and verification script
  ansible.builtin.template:
    src: restore.sh.j2
    dest: "{{ backup_restore_script_path | default(backup_script_path ~ '_restore') }}"
    owner: root
    group: root
    mode: "0755"
  when: backup_manage

- name: Install backup systemd service
  ansible.builtin.template:
    src: backup.service.j2
    dest: "/etc/systemd/system/{{ backup_service_unit }}"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart backup timer
  when: backup_manage

- name: Install backup systemd timer
  ansible.builtin.template:
    src: backup.timer.j2
    dest: "/etc/systemd/system/{{ backup_timer_unit }}"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart backup timer
  when: backup_manage

- name: Enable and start backup timer
  ansible.builtin.systemd:
    name: "{{ backup_timer_unit }}"
    enabled: true
    state: started
    daemon_reload: true
  when: backup_manage
