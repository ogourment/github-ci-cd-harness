---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

# Env-file changes restart only the active color (~3s blip). The next deploy
# does a full zero-downtime cutover.
- name: Restart active color
  ansible.builtin.shell: |
    set -euo pipefail
    color=$(cat {{ app_current_color_file }} 2>/dev/null || echo blue)
    release={{ app_root }}/${color}/bin/{{ otp_app_name }}

    if [[ -x "${release}" ]]; then
      systemctl restart {{ app_name }}@${color}.service
      echo restarted
    fi
  args:
    executable: /bin/bash
  register: active_color_restart
  changed_when: "'restarted' in active_color_restart.stdout"

- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded
