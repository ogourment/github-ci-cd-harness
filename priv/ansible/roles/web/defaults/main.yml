---
# nginx + Certbot TLS for a Phoenix app. Run phoenix_blue_green before this role
# so the upstream include exists before nginx validates the virtual host.
web_packages:
  - nginx
  - certbot
  - python3-certbot-nginx

nginx_site_name: "{{ app_name }}"
server_aliases: []
nginx_legacy_site_names: []
nginx_legacy_upstream_includes: []
nginx_drop_scanner_probes: true

# Set false on staging and any other non-production deployment. When false the
# vhost emits X-Robots-Tag: noindex, nofollow on every response, so a review
# environment cannot appear in search results alongside the real site.
app_is_production: true

# Proxy behavior shared by ordinary HTTP and WebSocket requests. The map
# variable must be unique because every enabled site is included in nginx's
# global http context.
nginx_connection_upgrade_var: "{{ app_name | replace('-', '_') }}_connection_upgrade"
nginx_proxy_next_upstream: "error timeout invalid_header"
nginx_proxy_next_upstream_tries: 2
nginx_proxy_connect_timeout: "2s"
nginx_proxy_read_timeout: "75s"
nginx_proxy_send_timeout: "75s"

# Optional nginx directives inserted into the canonical HTTPS server before
# the catch-all application proxy. Consumers can use this for a separately
# deployed operator surface such as /admin without patching generated files.
nginx_https_extra_locations: ""

# Optional persistent static uploads served directly by nginx. Set both values
# together; the URL prefix starts with a slash and omits the trailing slash.
nginx_uploads_dir: ""
nginx_uploads_url_prefix: ""
